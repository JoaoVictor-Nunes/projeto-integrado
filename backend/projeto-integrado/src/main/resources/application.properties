spring.application.name=BibliotecaPublicaVirtual
server.port=8080

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/meubanco
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=false

# --- MinIO (S3 SDK) ---
# Endpoint aponta para a porta 9000 do container que colocamos no docker-compose
minio.endpoint=http://localhost:9000
minio.accessKey=admin
minio.secretKey=password123
minio.bucketName=biblioteca-pdf

# --- Configuração de Upload ---
# Necessário para o Spring aceitar arquivos de livros (PDFs) que costumam ser pesados
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# --- JWT ---
# Chave secreta gerada com: openssl rand -base64 32
# NUNCA versione essa chave real no Git. Em produção, use variável de
# ambiente: jwt.secret=${JWT_SECRET}
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000

# --- E-mail para recuperação de senha ---
# Configure MAIL_USERNAME e MAIL_APP_PASSWORD no ambiente antes de iniciar o backend.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
